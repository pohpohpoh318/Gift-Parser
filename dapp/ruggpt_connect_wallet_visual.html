<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050806">
<title>RugGPT — Connect Wallet</title>
<style>
:root{
  --bg:#050706; --panel:rgba(8,14,10,.88); --green:#70f59a;
  --green2:#35c96d; --white:#f5f7f5; --muted:#87918a;
  --line:rgba(112,245,154,.22);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif}
body{
  min-height:100vh;display:grid;place-items:center;padding:28px 18px;
  color:var(--white);background:
    radial-gradient(ellipse at 50% 44%,rgba(31,115,57,.16),transparent 42%),
    radial-gradient(ellipse at 50% 100%,rgba(22,76,39,.12),transparent 42%),
    #050706;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:58px 58px;
  mask-image:radial-gradient(ellipse at center,#000 15%,transparent 78%);
}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbit{
  position:absolute;width:min(1120px,110vw);height:min(1120px,110vw);
  border:1px solid rgba(112,245,154,.27);border-radius:50%;
  left:50%;top:50%;transform:translate(-50%,-48%);
  box-shadow:0 0 35px rgba(58,220,112,.035),inset 0 0 35px rgba(58,220,112,.025);
}
.orbit:after{
  content:"";position:absolute;inset:8%;border:1px solid rgba(112,245,154,.045);
  border-radius:50%;
}
.dots{position:absolute;bottom:17%;display:grid;grid-template-columns:repeat(3,5px);gap:15px;opacity:.9}
.dots.left{left:7%}.dots.right{right:7%}
.dots i{width:5px;height:5px;border-radius:50%;background:#a0ffba;box-shadow:0 0 9px rgba(112,245,154,.65)}
.floating-particles{position:absolute;inset:0;overflow:hidden}
.particle{
  position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);
  display:block;border-radius:50%;background:#8dffad;
  opacity:var(--opacity);
  box-shadow:0 0 8px 2px rgba(112,245,154,.55),0 0 20px rgba(112,245,154,.3);
  animation:float-up var(--duration) var(--delay) infinite ease-in-out;
}
@keyframes float-up{
  0%{transform:translate3d(0,35px,0) scale(.65);opacity:0}
  15%{opacity:var(--opacity)}
  75%{opacity:var(--opacity)}
  100%{transform:translate3d(var(--drift),-145px,0) scale(1.2);opacity:0}
}
main{position:relative;z-index:1;width:min(100%,620px);text-align:center;padding:24px 10px 20px;animation:appear .7s ease both}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.brand-mark{
  width:68px;height:58px;margin:0 auto 30px;display:grid;place-items:center;
  color:var(--green);font-size:64px;font-weight:900;font-style:italic;line-height:1;
  letter-spacing:-.13em;text-shadow:0 0 25px rgba(92,255,145,.2);
  transform:skew(-9deg);
}
h1{margin:0;text-transform:uppercase;font-size:clamp(3.4rem,11vw,6.8rem);
  line-height:.82;letter-spacing:-.075em;font-weight:950}
h1 span{display:block}
h1 .green{
  margin-top:12px;color:var(--green);
  text-shadow:0 0 28px rgba(75,239,128,.12);
}
.subtitle{margin:30px 0 0;color:#c5ccc7;font-size:clamp(.66rem,2vw,.82rem);
  letter-spacing:.34em;text-transform:uppercase;font-weight:500}
.subtitle b{color:var(--green);font-weight:600}
.rule{display:flex;align-items:center;justify-content:center;gap:26px;margin:44px auto 30px}
.rule:before,.rule:after{content:"";width:112px;height:1px;background:linear-gradient(90deg,transparent,rgba(112,245,154,.7))}
.rule:after{transform:rotate(180deg)}
.rule i{width:8px;height:8px;border-radius:50%;background:#9affb5;box-shadow:0 0 15px 4px rgba(112,245,154,.45)}
.wallets{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  width:min(100%,510px);margin:0 auto;
}
.wallet{
  min-height:112px;padding:18px 10px 15px;border:1px solid rgba(112,245,154,.16);
  border-radius:14px;background:linear-gradient(145deg,rgba(17,27,20,.82),rgba(7,11,8,.9));
  box-shadow:inset 0 1px rgba(255,255,255,.035);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:11px;transition:.2s ease;
}
.wallet:hover{border-color:rgba(112,245,154,.48);transform:translateY(-3px);box-shadow:0 10px 32px rgba(0,0,0,.28),0 0 24px rgba(62,220,110,.07)}
.wallet-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:17px;font-weight:900;color:#061009;background:linear-gradient(145deg,#a4ffc0,#38c86d);
  box-shadow:0 0 18px rgba(79,231,127,.15)}
.wallet:nth-child(2) .wallet-icon{background:linear-gradient(145deg,#d6b7ff,#8b5ce6)}
.wallet:nth-child(3) .wallet-icon{background:linear-gradient(145deg,#a7d7ff,#5d8fe8)}
.wallet strong{font-size:.78rem;letter-spacing:.03em}
.note{margin:24px auto 0;color:#68736b;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
.bottom{margin-top:40px;color:#657068;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase}
.bottom span{color:var(--green)}
@media(max-width:480px){
  main{padding-top:12px}.brand-mark{margin-bottom:24px}
  .wallets{gap:8px}.wallet{min-height:100px;padding:14px 5px}
  .wallet strong{font-size:.7rem}.rule{margin:36px auto 24px}
  .dots{bottom:8%;gap:10px}.dots.left{left:4%}.dots.right{right:4%}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <div class="orbit"></div>
  <div class="dots left"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="dots right"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="floating-particles" id="floating-particles"></div>
</div>
<main>
  <h1><span>Connect</span><span class="green">Wallet</span></h1>
  <p class="subtitle">Connect. <b>Secure.</b> Bundle.</p>
  <div class="rule"><i></i></div>
  <section class="wallets" aria-label="Wallet options">
    <div class="wallet"><div class="wallet-icon">P</div><strong>Phantom</strong></div>
    <div class="wallet"><div class="wallet-icon">S</div><strong>Solflare</strong></div>
    <div class="wallet"><div class="wallet-icon">B</div><strong>Backpack</strong></div>
  </section>
  <p class="note">Wallet connection preview · Visual demo only</p>
  <div class="bottom">RUGGPT <span> / </span> SOLANA BUNDLER</div>
</main>
<script>
(() => {
  const layer = document.getElementById("floating-particles");
  if (!layer) return;
  const count = 75;
  for (let i = 0; i < count; i++) {
    const dot = document.createElement("i");
    dot.className = "particle";
    dot.style.setProperty("--x", (Math.random() * 100) + "%");
    dot.style.setProperty("--y", (15 + Math.random() * 85) + "%");
    dot.style.setProperty("--size", (2 + Math.random() * 3) + "px");
    dot.style.setProperty("--duration", (5 + Math.random() * 8) + "s");
    dot.style.setProperty("--delay", (-Math.random() * 12) + "s");
    dot.style.setProperty("--drift", ((Math.random() - .5) * 90) + "px");
    dot.style.setProperty("--opacity", (.25 + Math.random() * .55).toFixed(2));
    layer.appendChild(dot);
  }
})();
</script>
</body>
</html>
